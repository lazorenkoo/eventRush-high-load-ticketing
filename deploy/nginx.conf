map "$request_method:$http_origin" $reject_mutation {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    "POST:http://localhost:8082" 0;
    "PUT:http://localhost:8082" 0;
    "PATCH:http://localhost:8082" 0;
    "DELETE:http://localhost:8082" 0;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 128k;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/v1/(gates|queue)/ {
        if ($reject_mutation) { return 403; }
        proxy_pass http://crowdgate:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        if ($reject_mutation) { return 403; }
        proxy_pass http://eventrush:8082;
    }

    location /webhooks/ {
        return 404;
    }

    location / {
        proxy_pass http://eventrush:8082;
    }
}
