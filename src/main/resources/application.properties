spring.application.name=eventrush
server.port=${EVENTRUSH_PORT:8082}
spring.datasource.url=${EVENTRUSH_DATABASE_URL:jdbc:postgresql://localhost:55433/eventrush}
spring.datasource.username=${EVENTRUSH_DATABASE_USER:eventrush}
spring.datasource.password=${EVENTRUSH_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
